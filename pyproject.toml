[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evidencebench"
version = "1.0.0"
description = "High-precision retrieval-augmented generation with verifiable citations and abstention gatekeeping"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "sentence-transformers>=3.0.0",
    "pypdf>=4.2.0",
    "reportlab>=4.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
